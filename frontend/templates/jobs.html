<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs — AI Recruitment</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo"><h2>AI<span>Recruit</span></h2></div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item"><span class="icon">🏠</span> Dashboard</a>
            <a href="/jobs" class="nav-item active"><span class="icon">💼</span> Jobs</a>
            <a href="/upload-resume" class="nav-item"><span class="icon">📄</span> Upload Resume</a>
            <a href="/analytics" class="nav-item" id="analytics-nav-link"><span class="icon">📊</span> Analytics</a>
            <a href="/profile" class="nav-item"><span class="icon">👤</span> Profile</a>
            <a href="#" class="nav-item" id="logout-btn"><span class="icon">🚪</span> Logout</a>
        </nav>
        <div style="padding:16px;border-top:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:0.85rem;font-weight:600;color:#e2e8f0" id="user-name"></div>
            <div style="font-size:0.75rem;color:#475569" id="user-role"></div>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="header-title">Job Listings</div>
            <div class="header-actions">
                <button id="post-job-btn" class="btn btn-primary btn-sm" style="display:none" onclick="openJobModal()">+ Post Job</button>
                <button class="theme-toggle" id="theme-toggle">🌙</button>
            </div>
        </header>

        <div class="page-content">
            <!-- Search bar -->
            <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
                <div class="search-bar" style="flex:1;min-width:200px;">
                    <span>🔍</span>
                    <input type="text" id="search-input" placeholder="Search jobs by title, skills..." oninput="debounceSearch()" />
                </div>
                <button class="btn btn-outline" onclick="loadJobs()">Refresh</button>
            </div>

            <!-- Jobs list -->
            <div id="jobs-container">
                <div style="text-align:center;padding:40px;"><div class="spinner"></div></div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
</div>

<!-- POST JOB MODAL -->
<div id="job-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;">
    <div style="background:var(--bg-card);border-radius:16px;padding:32px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <h2 style="font-size:1.1rem;font-weight:700;">Post New Job</h2>
            <button onclick="closeJobModal()" style="background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--text-muted);">✕</button>
        </div>
        <div class="form-group"><label class="form-label">Job Title *</label><input class="form-control" id="jf-title" placeholder="e.g. Senior Python Developer" /></div>
        <div class="form-group"><label class="form-label">Company *</label><input class="form-control" id="jf-company" placeholder="Company name" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group"><label class="form-label">Location</label><input class="form-control" id="jf-location" placeholder="Mumbai, India" /></div>
            <div class="form-group"><label class="form-label">Job Type</label>
                <select class="form-control" id="jf-type">
                    <option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option>
                </select>
            </div>
        </div>
        <div class="form-group"><label class="form-label">Required Skills * (comma-separated)</label><input class="form-control" id="jf-skills" placeholder="Python, SQL, FastAPI, Machine Learning" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
            <div class="form-group"><label class="form-label">Min Exp (years)</label><input class="form-control" type="number" id="jf-min-exp" value="0" min="0"/></div>
            <div class="form-group"><label class="form-label">Max Exp (years)</label><input class="form-control" type="number" id="jf-max-exp" value="5" min="0"/></div>
            <div class="form-group"><label class="form-label">Education</label>
                <select class="form-control" id="jf-edu">
                    <option>Bachelor</option><option>Master</option><option>PhD</option><option>Diploma</option><option>Any</option>
                </select>
            </div>
        </div>
        <div class="form-group"><label class="form-label">Job Description *</label><textarea class="form-control" id="jf-desc" rows="4" placeholder="Describe the role, responsibilities..."></textarea></div>
        <div class="form-group"><label class="form-label">Requirements</label><textarea class="form-control" id="jf-req" rows="3" placeholder="What we're looking for..."></textarea></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitJob()">Post Job</button>
    </div>
</div>

<script src="/static/js/app.js"></script>
<script>
    let currentPage = 1;
    let searchTimeout = null;
    let userRole = "";

    document.addEventListener("DOMContentLoaded", async () => {
        if (!Auth.requireAuth()) return;
        const user = Auth.getUser();
        userRole = user.role;
        if (userRole === "recruiter" || userRole === "admin") {
            document.getElementById("post-job-btn").style.display = "inline-flex";
        }
        await loadJobs();
    });

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => { currentPage = 1; loadJobs(); }, 400);
    }

    async function loadJobs() {
        const search = document.getElementById("search-input").value;
        const container = document.getElementById("jobs-container");
        showLoading(container);
        try {
            const params = new URLSearchParams({ page: currentPage, per_page: 10 });
            if (search) params.append("search", search);
            const data = await API.get(`/api/jobs/?${params}`);
            renderJobs(data);
        } catch (err) {
            container.innerHTML = `<p style="color:#ef4444;text-align:center;">Failed to load jobs: ${err.message}</p>`;
        }
    }

    function renderJobs(data) {
        const container = document.getElementById("jobs-container");
        if (!data.jobs.length) {
            container.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-muted);">
                <div style="font-size:3rem;margin-bottom:12px;">💼</div>
                <p>No jobs found. ${userRole === "recruiter" ? "Post the first one!" : "Check back later."}</p>
            </div>`;
            return;
        }

        container.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;">${data.jobs.map(job => `
            <div class="card" style="padding:20px;cursor:pointer;" onclick="viewJob(${job.id})">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
                    <div>
                        <div style="font-weight:700;font-size:1rem;margin-bottom:4px;">${job.title}</div>
                        <div style="font-size:0.85rem;color:var(--text-secondary);">🏢 ${job.company} &nbsp;📍 ${job.location||"Remote"} &nbsp;⏱️ ${job.job_type}</div>
                    </div>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                        <span class="badge badge-blue">${job.required_education || "Any"}</span>
                        <span class="badge badge-green">${job.min_experience}+ yrs</span>
                        ${userRole === "candidate" ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();applyToJob(${job.id})">Apply Now</button>` : `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();viewRanking(${job.id})">View Applicants</button>`}
                    </div>
                </div>
                ${job.required_skills ? `<div class="skill-tags" style="margin-top:12px;">${job.required_skills.split(",").slice(0,6).map(s=>`<span class="skill-tag">${s.trim()}</span>`).join("")}</div>` : ""}
                <div style="font-size:0.75rem;color:var(--text-muted);margin-top:10px;">Posted ${formatDate(job.created_at)}</div>
            </div>`).join("")}
        </div>`;

        // Pagination
        const totalPages = Math.ceil(data.total / data.per_page);
        const pg = document.getElementById("pagination");
        pg.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement("button");
            btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
            btn.textContent = i;
            btn.onclick = () => { currentPage = i; loadJobs(); };
            pg.appendChild(btn);
        }
    }

    async function applyToJob(jobId) {
        try {
            const result = await API.post(`/api/resume/apply/${jobId}`, {});
            Toast.show(`Applied! ATS Score: ${result.ats_score.toFixed(0)}% | Match: ${result.match_score.toFixed(0)}%`, "success", 5000);
        } catch (err) {
            Toast.show(err.message, "error");
        }
    }

    function viewRanking(jobId) { window.location.href = `/analytics?job=${jobId}`; }
    function viewJob(id) { /* Could open a detail modal */ }

    function openJobModal() { document.getElementById("job-modal").style.display = "flex"; }
    function closeJobModal() { document.getElementById("job-modal").style.display = "none"; }

    async function submitJob() {
        const payload = {
            title: document.getElementById("jf-title").value,
            company: document.getElementById("jf-company").value,
            location: document.getElementById("jf-location").value,
            job_type: document.getElementById("jf-type").value,
            required_skills: document.getElementById("jf-skills").value,
            min_experience: parseInt(document.getElementById("jf-min-exp").value) || 0,
            max_experience: parseInt(document.getElementById("jf-max-exp").value) || 10,
            required_education: document.getElementById("jf-edu").value,
            description: document.getElementById("jf-desc").value,
            requirements: document.getElementById("jf-req").value,
        };
        if (!payload.title || !payload.company || !payload.description) {
            Toast.show("Title, company, and description are required.", "error"); return;
        }
        try {
            await API.post("/api/jobs/", payload);
            Toast.show("Job posted successfully!", "success");
            closeJobModal();
            loadJobs();
        } catch (err) {
            Toast.show(err.message, "error");
        }
    }
</script>
</body>
</html>
